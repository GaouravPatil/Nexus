name: Deploy Nexus Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/gaouravpatil/nexus-backend:latest \
            -t ghcr.io/gaouravpatil/nexus-backend:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/gaouravpatil/nexus-backend:latest
          docker push ghcr.io/gaouravpatil/nexus-backend:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected to EC2"
            whoami
            hostname
            pwd

            echo "Checking Nexus directory..."
            ls -la /home/ubuntu/Nexus

            echo "Running deployment..."
            cd /home/ubuntu/Nexus
            chmod +x deploy-nexus.sh
            ./deploy-nexus.sh
